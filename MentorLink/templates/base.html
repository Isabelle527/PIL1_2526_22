{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFRI MentorLink</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet">

</head>
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #7c3aed;
      --accent: #f97316;
      --success: #10b981;
      --dark: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --white: #ffffff;
      --light: #f8fafc;
      --card: rgba(255, 255, 255, 0.72);
      --border: rgba(255, 255, 255, 0.25);
      --shadow: 0 20px 60px rgba(37, 99, 235, 0.15);
      --radius: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", sans-serif;
      color: var(--dark);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(124, 58, 237, 0.18), transparent 30%),
        radial-gradient(circle at bottom left, rgba(249, 115, 22, 0.12), transparent 25%),
        linear-gradient(135deg, #f8fbff 0%, #eef4ff 45%, #fef6ff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-blur {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.55;
      animation: float 9s ease-in-out infinite;
    }

    .blob.one {
      width: 260px;
      height: 260px;
      background: rgba(37, 99, 235, 0.28);
      top: 80px;
      left: -50px;
    }

    .blob.two {
      width: 240px;
      height: 240px;
      background: rgba(124, 58, 237, 0.22);
      top: 140px;
      right: -60px;
      animation-delay: 1.2s;
    }

    .blob.three {
      width: 220px;
      height: 220px;
      background: rgba(249, 115, 22, 0.18);
      bottom: 50px;
      left: 30%;
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-18px) scale(1.04); }
    }

    .container {
      width: min(1180px, 92%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* NAVBAR CORRIGÉE POUR LE CENTRAGE EFFECTIF */
    .navbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      margin: 18px auto 0;
      backdrop-filter: blur(16px);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .nav-content {
      display: flex;
      align-items: center;
      justify-content: space-between; /* Force l'alignement Gauche / Centre / Droite */
      padding: 12px 24px;
    }

    /* Ajustement du bloc Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--dark);
      text-decoration: none;
      flex-shrink: 0; /* Empêche le logo de rétrécir */
    }

    .logo-img {
      height: 40px; /* Taille adaptée pour ton logo en image */
      width: auto;
      object-fit: contain;
    }

    /* Bloc central des liens de navigation */
    .nav-links-container {
      display: flex;
      justify-content: center;
      flex-grow: 1; /* Aloue tout l'espace du milieu pour permettre le centrage */
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
      list-style: none; /* Enlève les puces de la liste <ul> */
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    /* Bloc des boutons d'actions à droite */
    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0; /* Empêche les boutons de rétrécir */
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.7);
      color: var(--dark);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .btn-outline:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 20px 40px rgba(99, 102, 241, 0.35);
    }

    /* HERO */
    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 46px;
      align-items: center;
      min-height: calc(100vh - 120px);
      padding: 60px 0 40px;
    }
    
    .hover-shadow {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .hover-shadow:hover {
        transform: translateY(-5px);
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.075) !important;
    }
    
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(37, 99, 235, 0.12);
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 20px;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.05);
    }

    .hero h1 {
      font-size: clamp(2.6rem, 5vw, 4.5rem);
      line-height: 1.05;
      font-weight: 800;
      margin-bottom: 18px;
      color: var(--dark);
    }

    .hero h1 .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.08rem;
      line-height: 1.8;
      color: var(--muted);
      max-width: 650px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .hero-stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .stat-pill {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 14px 18px;
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.06);
      min-width: 140px;
    }

    .stat-pill h3 {
      font-size: 1.2rem;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .stat-pill span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* HERO VISUAL */
    .hero-visual {
      position: relative;
    }

    .visual-card {
      position: relative;
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .visual-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(37, 99, 235, 0.08),
        rgba(124, 58, 237, 0.06),
        rgba(249, 115, 22, 0.05)
      );
      pointer-events: none;
    }

    .mentor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .mini-tag {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
    }

    .mentor-grid {
      display: grid;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .mentor-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 20px;
      padding: 14px;
      transition: 0.25s ease;
    }

    .mentor-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .avatar.a1 { background: linear-gradient(135deg, #2563eb, #38bdf8); }
    .avatar.a2 { background: linear-gradient(135deg, #7c3aed, #a855f7); }
    .avatar.a3 { background: linear-gradient(135deg, #f97316, #fb7185); }

    .mentor-info h4 {
      font-size: 1rem;
      margin-bottom: 4px;
      color: var(--dark);
    }

    .mentor-info p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--muted);
    }

    .floating-box {
      position: absolute;
      background: white;
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.12);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--dark);
      animation: float 7s ease-in-out infinite;
    }

    .floating-box.one {
      top: -20px;
      right: -20px;
    }

    .floating-box.two {
      bottom: -18px;
      left: -18px;
      animation-delay: 1.5s;
    }

    .floating-box span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 4px;
    }

    /* FEATURES */
    .features {
      padding: 30px 0 80px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 34px;
    }

    .section-title h2 {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      margin-bottom: 12px;
    }

    .section-title p {
      color: var(--muted);
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.8;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.06);
      transition: 0.3s ease;
    }

    .feature-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 42px rgba(37, 99, 235, 0.12);
    }

    .feature-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      margin-bottom: 18px;
      color: white;
    }

    .i1 { background: linear-gradient(135deg, #2563eb, #3b82f6); }
    .i2 { background: linear-gradient(135deg, #7c3aed, #a855f7); }
    .i3 { background: linear-gradient(135deg, #f97316, #fb7185); }

    .feature-card h3 {
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .feature-card p {
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.96rem;
    }

    /* FOOTER */
    footer {
      padding: 30px 0 50px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* MOBILE */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--dark);
    }

    @media (max-width: 980px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 40px;
      }

      .hero-visual {
        order: -1;
      }

      .feature-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .nav-links-container,
      .nav-actions .btn-light {
        display: none;
      }

      .menu-toggle {
        display: block;
      }

      .nav-links.active {
        position: absolute;
        top: 78px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      }

      .hero h1 {
        font-size: 2.5rem;
      }

      .floating-box {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="bg-blur">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
  </div>
  <div class="container">
  <nav class="navbar">
    <div class="nav-content">
      <a href="{% url 'home' %}" class="logo">
        <img src="{% static 'asset/logo-ifri.png' %}" alt="IFRI MentorLink Logo">
        <span>IFRI MentorLink</span>
      </a>
      <div class="nav-links-container">
        <div class="nav-links">
          <a href="{% url 'home' %}">Accueil</a>
          <a href="{% url 'fonctionnalites' %}">Fonctionnalités</a>
          <a href="{% url 'mentors' %}">Mentors</a>
          <a href="{% url 'contact' %}">Contact</a>
        </div>
      </div>

      <!-- DROITE : Boutons -->
      <div class="nav-actions">
        <a href="#" class="btn btn-outline">Se connecter</a>
        <a href="#" class="btn btn-primary">Rejoindre</a>
        <button class="menu-toggle" id="menuToggle">☰</button>
      </div>

    </div>
  </nav>
</div>

    <section class="hero">
      <main>
    {% block content %}
    {% endblock %}
</main>
  </script>
</body>
</html>
